<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitud de alta local</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0f172a; font-family: 'Segoe UI', Inter, Roboto, -apple-system, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #0f172a; padding: 40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color: #1e293b; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.3);">
          <tr>
            <td style="background: linear-gradient(135deg, #ef4444, #f97316); padding: 32px 40px; text-align: center;">
              <div style="font-size: 28px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px;">
                Servicios OCC
              </div>
              <div style="font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 6px;">
                Solicitud de alta local
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding: 40px;">
              <p style="margin: 0 0 8px; font-size: 18px; font-weight: 600; color: #f1f5f9;">
                Hola {{ requesterName }},
              </p>
              <p style="margin: 0; font-size: 14px; color: #94a3b8; line-height: 1.7;">
                Tu solicitud de alta local no ha sido aprobada.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color: #0f172a; padding: 24px 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
              <p style="margin: 0; font-size: 11px; color: #475569; line-height: 1.6;">
                Mensaje automático del sistema. No respondas a este correo.
              </p>
              <p style="margin: 10px 0 0; font-size: 11px; color: #334155;">
                © 2026 OCC Security Team
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
