services:
  # ── MySQL ───────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: occ-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-occ_vulns}
      MYSQL_USER: ${MYSQL_USER:-occ_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-OCC_S3cur3_P4ss!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-OCC_R00t_P4ss!}
    env_file:
      - .env.prod
    volumes:
      - mysql_info:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - occ_net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: occ-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-OCC_R3d1s_P4ss!}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-OCC_R3d1s_P4ss!}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - occ_net

  # ── API NestJS ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: occ-api
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-occ_admin}:${MYSQL_PASSWORD:-OCC_S3cur3_P4ss!}@mysql:3306/${MYSQL_DATABASE:-occ_vulns}
      REDIS_URL: redis://:${REDIS_PASSWORD:-OCC_R3d1s_P4ss!}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    env_file:
      - .env.prod
      # SMTP configs are now in DB, but we can keep env vars for potential seed/fallback if needed
      # SMTP_HOST: ${SMTP_HOST:-}
      # ...
    volumes:
      - ./storage:/app/storage
      # Mount entrypoint if we want to change it without rebuild, but better to burn it in
      # - ./docker/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - occ_net

  # ── Frontend React (servido por Nginx interno en puerto 80) ─
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: occ-frontend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - occ_net

  # ── Nginx Reverse Proxy + SSL ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: occ-nginx
    restart: always
    ports:
      - "${OCC_HTTP_PORT:-80}:80"
      - "${OCC_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/occ.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - occ_net

volumes:
  mysql_info:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  occ_net:
    driver: bridge
