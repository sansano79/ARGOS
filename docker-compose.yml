services:
  # ── MySQL ───────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: occ-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-occ_vulns}
      MYSQL_USER: ${MYSQL_USER:-occ_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_info:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: occ-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache_net

  # ── API NestJS ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: occ-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      OCC_ENV: ${OCC_ENV:-production}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api_net
      - db_net
      - cache_net

  # ── Frontend React (servido por Nginx interno en puerto 80) ─
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: occ-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edge_net

  # ── Nginx Reverse Proxy + SSL ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: occ-nginx
    restart: unless-stopped
    ports:
      - "${OCC_HTTP_PORT:-80}:80"
      - "${OCC_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/occ.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge_net
      - api_net

volumes:
  mysql_info:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  edge_net:
    driver: bridge
  api_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true
  cache_net:
    driver: bridge
    internal: true
